<h2>Jobs Management</h2>

<table class="jobs-table">

<thead>

<tr>
<th>ID</th>
<th>Title</th>
<th>Location</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody>

<tr *ngFor="let job of jobs">

<td>{{job.id}}</td>
<td>{{job.title}}</td>
<td>{{job.location}}</td>

<td>
<span [class.active]="job.active"
      [class.inactive]="!job.active">

{{job.active ? 'Active' : 'Inactive'}}

</span>
</td>

<td>

<button (click)="viewApplications(job.id)">
View Applications
</button>

<button (click)="deleteJob(job.id)">
Delete
</button>

</td>

</tr>

</tbody>

</table>
